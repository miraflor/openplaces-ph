name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Osmium lets tests/test_osm_prepare.py run instead of being skipped.
      - run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
      - run: python -m compileall -q src tests run.py
      - run: |
          openplaces --version
          openplaces --help
          openplaces areas
          openplaces storage
