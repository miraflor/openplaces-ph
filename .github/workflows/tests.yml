name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Osmium lets tests/test_osm_prepare.py run instead of being skipped.
      - run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - run: pip install -e . pytest
      - run: pytest -q
      - run: python -m compileall -q src tests run.py
      - run: openplaces --help
