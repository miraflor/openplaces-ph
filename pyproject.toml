[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openplaces-ph"
version = "0.2.1"
description = "Open, provenance-aware Philippine places and establishment data built by triangulating multiple open geospatial sources."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "OpenPlaces PH contributors"}]
dependencies = [
    "duckdb==1.5.5",
    "numpy",
    "pyarrow",
    "PyYAML",
    "requests",
    "huggingface_hub",
    "overturemaps==1.0.1",
]

[project.scripts]
openplaces = "openplaces_ph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
